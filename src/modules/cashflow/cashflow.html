<div id="cashflow-module">
    <div class="cf-buttons">

        <div class="cf-section">
            <span class="cf-section-title">PREPARE</span>
        </div>

        <button class="cf-btn" id="cf-goto-schedules">
            <img src="/assets/goto.png" class="cf-icon" alt="Go To Schedules" />
            <span>Go To Schedules</span>
        </button>

        <button class="cf-btn" id="cf-cleardata">
            <img src="/assets/clear.png" class="cf-icon" alt="Clear Data" />
            <span>Clear Data</span>
        </button>

        <div class="cf-section">
            <span class="cf-section-title">BEFORE</span>
        </div>

        <button class="cf-btn" id="cf-import-before">
            <img src="/assets/clipboard.png" class="cf-icon" alt="Import Schedule" />
            <span>Import Schedule</span>
        </button>

        <div class="cf-section">
            <span class="cf-section-title">AFTER</span>
        </div>

        <button class="cf-btn" id="cf-import-after">
            <img src="/assets/clipboard.png" class="cf-icon" alt="Import Schedule" />
            <span>Import Schedule</span>
        </button>

        <div class="cf-section">
            <span class="cf-section-title">TOOLS</span>
        </div>

        <button class="cf-btn" id="cf-generate-pdf">
            <img src="/assets/pdf.png" class="cf-icon" alt="Create PDF" />
            <span>Create PDF</span>
        </button>

        <button class="cf-btn" id="cf-settings">
            <img src="/assets/goto.png" class="cf-icon" alt="Go To Settings" />
            <span>Go To Settings</span>
        </button>

        <button class="cf-btn" id="cf-preferences">
            <img src="/assets/settings_green.png" class="cf-icon" alt="Preferences" />
            <span>Preferences</span>
        </button>

        <button class="cf-btn" id="cf-about">
            <img src="/assets/biostar_250.png" class="cf-icon" alt="About" />
            <span>About</span>
        </button>
    </div>
</div>

<!-- Cash Flow Settings Dialog -->
<div id="cf-settings-dialog" class="modal hidden">
    <div class="modal-content settings-modal">
        <div class="settings-header">
            <h2 class="ms-font-xl">Cash Flow Analysis Settings</h2>
            <button id="cf-settings-close" class="settings-close-btn" aria-label="Close settings">×</button>
        </div>
        
        <div class="settings-body">
            <div class="settings-section">
                <h3 class="ms-font-l">Default Frequency</h3>
                <p class="ms-font-s settings-description">
                    Select the default frequency to use when clearing data. This will be applied to both \FrequencyNGS and \FrequencyNCino named ranges.
                </p>
                <select id="cf-frequency-select" class="ms-Dropdown" title="Default Frequency">
                    <option value="Annually">Annually</option>
                    <option value="Semi-Annually">Semi-Annually</option>
                    <option value="Quarterly">Quarterly</option>
                    <option value="Monthly">Monthly</option>
                    <option value="At Maturity">At Maturity</option>
                </select>
            </div>
        </div>
        
        <div class="settings-footer">
            <div class="settings-actions">
                <button id="cf-settings-save" class="ms-Button ms-Button--primary">Save</button>
            </div>
        </div>
    </div>
</div>
